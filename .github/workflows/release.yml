name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run core unit tests
        run: node --test "test/**/*.test.ts"

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Compose the bilingual release body
        # One release body carrying both languages: the English notes followed by
        # the Chinese notes, each staying a complete document of its own.
        run: |
          {
            cat docs/RELEASE.md
            printf '\n---\n\n'
            cat docs/RELEASE.zh.md
          } > "$RUNNER_TEMP/release-body.md"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: dsh-kingdee ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: ${{ runner.temp }}/release-body.md
          # No documentation files are attached as release assets: the release
          # carries its bilingual notes as the body only. The docs live in the
          # repository (and in the npm package) and are linked from the notes.
