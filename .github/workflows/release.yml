name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run core unit tests
        run: node --test "test/**/*.test.ts"

  release:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: dsh-kingdee ${{ steps.tag.outputs.tag }}
          draft: false
          prerelease: false
          body_path: docs/RELEASE.md
          files: |
            README.md
            INSTALL.md
            CONFIG.md
            CONFIG.zh.md
            UPDATE.md
            UNINSTALL.md
            CHANGELOG.md
            LICENSE

  publish:
    name: Publish to npm
    needs: test
    # Silent skip until the NPM_TOKEN repo secret is configured.
    if: secrets.NPM_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish (prepublishOnly runs build)
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
