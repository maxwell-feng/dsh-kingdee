name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bilingual docs rule: one language per file, pairs and switchers
      # complete. Needs no dependencies — Node strips the types — so it gates
      # before the install step.
      - name: Docs language
        run: node scripts/check-docs-language.ts

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
