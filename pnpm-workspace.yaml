# DSH publishes prereleases continuously, so every `@deepseek-ai/*` revision this
# plugin pins is younger than pnpm's minimum-release-age gate. Each pinned
# package@version is exempted explicitly — pnpm accepts exact versions (or
# `||` unions), never ranges. Refresh this list with the lockfile when bumping.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/dsh-agent@0.2.0-rc.1'
