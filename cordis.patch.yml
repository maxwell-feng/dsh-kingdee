# dsh-kingdee composition layer.
#
# Applied when a DSH profile lists the dsh-kingdee bundle (see INSTALL.md).
# The row mounts the plugin so it can register its typed tool set and wire the
# credential references. Since DSH 0.1.7 there is no settings registration here:
# the Host reads the `Config` schema the plugin exports and serves this row's
# form under the row id `kingdee`. Peer packages (@deepseek-ai/dsh-tools,
# @deepseek-ai/dsh-credentials) are already present in any DSH composition that
# ships the web GUI.
- insert:
    - id: kingdee
      name: dsh-kingdee
      enabled: true
      config:
        # Connection and credential references live in the Settings card / config,
        # not in this patch. The values below are defaults only and are resolved
        # through the credentials seam (env-var references) at runtime.
        baseUrl: ""
        acctId: ""
        authMode: "user"
        # Credential references (env-var names), NOT literal secrets.
        appId: ""
        appSecretRef: "DSH_KINGDEE_APP_SECRET"
        userNameRef: "DSH_KINGDEE_USER"
        passwordRef: "DSH_KINGDEE_PASSWORD"
        lcid: 2052
        mock: false
